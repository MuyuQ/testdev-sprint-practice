# pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# pythonpath=. 让根目录下的 utils/ fixtures/ server/ 能被 import（需 pytest>=7）
pythonpath = .
addopts = -v --alluredir=reports/allure-results
markers =
    smoke: 冒烟测试
    regression: 回归测试
    slow: 慢速测试
